name: Deploy docs to GitHub Pages

on:
  # Deploy on every push to the default branch.
  push:
    branches: [main]
  # ...and allow a manual run from the Actions tab.
  workflow_dispatch:

# Least-privilege token that can publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Pages
        id: pages
        # Computes the correct base path for this repo (e.g. "/pulse_docs" for a
        # project site, "" for a user/org site) and exposes it as base_path.
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build static export
        run: npm run build
        env:
          # Feed the computed base path into next.config.ts.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
